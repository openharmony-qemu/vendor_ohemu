{
  "jobs": [
    {
      "name": "param:bootevent.boot.completed=true",
      "condition": "bootevent.boot.completed=true",
      "cmds": [
        "start qemu_sceneboard_user_unlock",
        "start qemu_sceneboard_unlock"
      ]
    }
  ],
  "services": [
    {
      "name": "qemu_sceneboard_user_unlock",
      "path": [
        "/system/bin/cem",
        "publish",
        "-e",
        "usual.event.USER_UNLOCKED",
        "-c",
        "100"
      ],
      "uid": "system",
      "gid": [
        "system"
      ],
      "apl": "system_core",
      "permission": [
        "ohos.permission.PUBLISH_SYSTEM_COMMON_EVENT",
        "ohos.permission.INTERACT_ACROSS_LOCAL_ACCOUNTS"
      ],
      "once": 1,
      "start-mode": "condition",
      "secon": "u:r:cem:s0"
    },
    {
      "name": "qemu_sceneboard_unlock",
      "path": [
        "/system/bin/cem",
        "publish",
        "-e",
        "usual.event.SCREEN_UNLOCKED",
        "-u",
        "100"
      ],
      "uid": "system",
      "gid": [
        "system"
      ],
      "apl": "system_core",
      "permission": [
        "ohos.permission.PUBLISH_SYSTEM_COMMON_EVENT",
        "ohos.permission.INTERACT_ACROSS_LOCAL_ACCOUNTS"
      ],
      "once": 1,
      "start-mode": "condition",
      "secon": "u:r:cem:s0"
    }
  ]
}
